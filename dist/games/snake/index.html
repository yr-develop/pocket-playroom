<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ポケットスネーク | POCKET PLAYROOM</title>
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="game.css">
  <script src="../../assets/js/frame.js"></script>
  <script src="../../assets/js/soundboard.js" defer></script>
  <script src="../../assets/js/controls.js" defer></script>
  <script src="game.js" defer></script>
</head>
<body>
  <main class="console">
    <div class="console__topbar">
      <a class="back-link" href="../../">← LOBBY</a>
      <span class="speaker-slots"></span>
      <button class="text-button" data-sound-toggle>♪ SOUND ON</button>
    </div>
    <section class="screen-wrap">
      <div class="screen snake-screen">
        <header>
          <div><p class="eyebrow">CARTRIDGE 09</p><h1>ポケットスネーク</h1></div>
          <div>SCORE <b id="score">0000</b></div>
        </header>
        <div class="hud"><span id="level">LEVEL 01</span><span id="mode">WALL</span><span id="high">HI 0000</span></div>
        <canvas id="game" width="360" height="504" aria-label="スネークゲーム画面"></canvas>
        <p id="status">十字をタップ、または矢印キーでスタート</p>
      </div>
    </section>
    <div class="console__controls">
      <div class="dpad">
        <button class="dpad__key dpad__key--up" data-control="up" aria-label="上"></button>
        <button class="dpad__key dpad__key--right" data-control="right" aria-label="右"></button>
        <button class="dpad__key dpad__key--down" data-control="down" aria-label="下"></button>
        <button class="dpad__key dpad__key--left" data-control="left" aria-label="左"></button>
        <span class="dpad__center"></span>
      </div>
      <div class="control-meta">
        <div class="system-buttons">
          <button class="system-button" data-control="select">MODE</button>
          <button class="system-button" data-control="start">PAUSE</button>
        </div>
        <span>SELECT: WALL / WRAP</span>
      </div>
      <div class="ab-buttons">
        <button class="ab-button" data-control="b"><span>B</span><small>BACK</small></button>
        <button class="ab-button" data-control="a"><span>A</span><small>BOOST</small></button>
      </div>
    </div>
  </main>
</body>
</html>
