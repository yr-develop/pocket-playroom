<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#252a34">
  <title>ポケットランナー | POCKET PLAYROOM</title>
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="game.css">
  <script src="../../assets/js/frame.js"></script>
  <script src="../../assets/js/soundboard.js" defer></script>
  <script src="../../assets/js/controls.js" defer></script>
  <script src="game.js" defer></script>
</head>
<body>
  <main class="console" aria-labelledby="game-title">
    <div class="console__topbar">
      <a class="back-link" href="../../">← LOBBY</a>
      <span class="speaker-slots"></span>
      <button class="text-button" type="button" data-sound-toggle>♪ SOUND ON</button>
    </div>
    <section class="screen-wrap">
      <div class="screen runner-screen">
        <header>
          <div><p class="eyebrow">CARTRIDGE 10</p><h1 id="game-title">ポケットランナー</h1></div>
          <div class="score-box">SCORE <b id="score">00000</b></div>
        </header>
        <div class="runner-hud"><span id="speed">SPEED 1.0</span><span id="high">HI 00000</span></div>
        <canvas id="game" width="360" height="500" aria-label="横スクロールジャンプゲーム画面"></canvas>
        <p id="status">画面をタップ、またはA/上でジャンプ</p>
      </div>
    </section>
    <div class="console__controls">
      <div class="dpad" role="group" aria-label="十字キー">
        <button class="dpad__key dpad__key--up" type="button" data-control="up" aria-label="ジャンプ"></button>
        <button class="dpad__key dpad__key--right" type="button" data-control="right" aria-label="右"></button>
        <button class="dpad__key dpad__key--down" type="button" data-control="down" aria-label="下"></button>
        <button class="dpad__key dpad__key--left" type="button" data-control="left" aria-label="左"></button>
        <span class="dpad__center"></span>
      </div>
      <div class="control-meta">
        <div class="system-buttons">
          <button class="system-button" type="button" data-control="select">SOUND</button>
          <button class="system-button" type="button" data-control="start">PAUSE</button>
        </div>
        <span>JUMP ONLY / KEEP RUNNING</span>
      </div>
      <div class="ab-buttons">
        <button class="ab-button ab-button--b" type="button" data-control="b"><span>B</span><small>BACK</small></button>
        <button class="ab-button ab-button--a" type="button" data-control="a"><span>A</span><small>JUMP</small></button>
      </div>
    </div>
  </main>
</body>
</html>
