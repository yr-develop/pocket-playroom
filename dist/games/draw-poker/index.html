<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#252a34">
<title>本格ポーカー | POCKET PLAYROOM</title>
<link rel="stylesheet" href="../../assets/css/base.css"><link rel="stylesheet" href="game.css">
<script src="../../assets/js/frame.js"></script><script src="../../assets/js/soundboard.js" defer></script><script src="../../assets/js/controls.js" defer></script><script src="game.js" defer></script>
</head><body><main class="console" aria-labelledby="game-title">
<div class="console__topbar"><a class="back-link" href="../../">← LOBBY</a><span class="speaker-slots"></span><button class="text-button" type="button" data-sound-toggle>♪ SOUND ON</button></div>
<section class="screen-wrap"><div class="screen poker-screen">
<header><div><p class="eyebrow">CARTRIDGE 05</p><h1 id="game-title">本格ポーカー</h1></div><div class="chips">CHIPS <b id="chips">200</b></div></header>
<div class="round-strip"><span id="round">ROUND 01</span><span id="minimum">MIN BET 1</span><span id="pot">POT 0</span></div>
<section class="hand-zone"><span>CPU</span><div id="cpu-hand" class="card-row"></div><small id="cpu-action">WAIT</small></section>
<section class="hand-zone"><span>YOU</span><div id="player-hand" class="card-row"></div><small id="your-hand">NO HAND</small></section>
<div class="bet-panel"><span>YOUR BET</span><button id="bet-down" type="button">−</button><b id="bet">0</b><button id="bet-up" type="button">＋</button></div>
<p id="status" class="status" aria-live="polite">DEALをタップ、またはSTARTで開始</p><button id="action" class="action" type="button">DEAL</button>
</div></section>
<div class="console__controls"><div class="dpad" role="group" aria-label="十字キー"><button class="dpad__key dpad__key--up" type="button" data-control="up" aria-label="上"></button><button class="dpad__key dpad__key--right" type="button" data-control="right" aria-label="右"></button><button class="dpad__key dpad__key--down" type="button" data-control="down" aria-label="下"></button><button class="dpad__key dpad__key--left" type="button" data-control="left" aria-label="左"></button><span class="dpad__center"></span></div>
<div class="control-meta"><div class="system-buttons"><button class="system-button" type="button" data-control="select">BET</button><button id="start-key" class="system-button" type="button" data-control="start">DEAL</button></div><span id="mode">MIN 1</span></div>
<div class="ab-buttons"><button class="ab-button ab-button--b" type="button" data-control="b"><span>B</span><small>FOLD</small></button><button class="ab-button ab-button--a" type="button" data-control="a"><span>A</span><small>SELECT</small></button></div></div>
</main></body></html>
