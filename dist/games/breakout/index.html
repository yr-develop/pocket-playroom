<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ブロック崩し | POCKET PLAYROOM</title>
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="game.css">
  <script src="../../assets/js/frame.js"></script>
  <script src="../../assets/js/soundboard.js" defer></script>
  <script src="../../assets/js/controls.js" defer></script>
  <script src="game.js" defer></script>
</head>
<body>
  <main class="console">
    <div class="console__topbar">
      <a class="back-link" href="../../">← LOBBY</a><span class="speaker-slots"></span>
      <button class="text-button" type="button" data-sound-toggle>♪ SOUND ON</button>
    </div>
    <section class="screen-wrap">
      <div class="screen arcade-screen">
        <header><div><p class="eyebrow">CARTRIDGE 07</p><h1>ブロック崩し</h1></div><div>SCORE <b id="score">000000</b></div></header>
        <div class="hud"><span id="stage">STAGE 01</span><span id="lives">BALL ●●●</span><span id="high">HI 000000</span></div>
        <canvas id="game" width="360" height="500" aria-label="ブロック崩しゲーム画面"></canvas>
        <p id="status">Aをタップ/Enterで発射・十字をタップ/矢印キーで移動</p>
      </div>
    </section>
    <div class="console__controls">
      <div class="dpad" role="group" aria-label="十字キー">
        <button class="dpad__key dpad__key--up" type="button" data-control="up" aria-label="上"></button>
        <button class="dpad__key dpad__key--right" type="button" data-control="right" aria-label="右"></button>
        <button class="dpad__key dpad__key--down" type="button" data-control="down" aria-label="下"></button>
        <button class="dpad__key dpad__key--left" type="button" data-control="left" aria-label="左"></button>
        <span class="dpad__center"></span>
      </div>
      <div class="control-meta"><div class="system-buttons"><button class="system-button" type="button" data-control="select">CENTER</button><button class="system-button" type="button" data-control="start">PAUSE</button></div><span>BREAK ALL BLOCKS</span></div>
      <div class="ab-buttons"><button class="ab-button" type="button" data-control="b"><span>B</span><small>BACK</small></button><button class="ab-button" type="button" data-control="a"><span>A</span><small>LAUNCH</small></button></div>
    </div>
  </main>
</body>
</html>
