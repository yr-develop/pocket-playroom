<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#252a34">
  <meta name="description" content="5枚の記号カードを交換し、CPUと役を競う絵合わせポーカー。">
  <title>絵合わせポーカー | POCKET PLAYROOM</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23252a34'/%3E%3Crect x='8' y='13' width='20' height='38' rx='3' fill='%23f5edd9'/%3E%3Crect x='36' y='13' width='20' height='38' rx='3' fill='%23f5edd9'/%3E%3Cpath d='m18 22 3 7 7 1-5 5 2 7-7-4-7 4 2-7-5-5 7-1zM46 22l3 7 7 1-5 5 2 7-7-4-7 4 2-7-5-5 7-1z' fill='%23de5c4c'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="game.css">
  <script src="../../assets/js/frame.js"></script>
  <script src="../../assets/js/soundboard.js" defer></script>
  <script src="../../assets/js/controls.js" defer></script>
  <script src="game.js" defer></script>
</head>
<body>
  <main class="console console--poker" aria-labelledby="game-title">
    <div class="console__topbar">
      <a class="back-link" href="../../">← LOBBY</a>
      <span class="speaker-slots" aria-hidden="true"></span>
      <button class="text-button" type="button" data-sound-toggle aria-pressed="true">♪ SOUND ON</button>
    </div>

    <section class="screen-wrap">
      <div class="screen poker-screen">
        <header class="poker-header">
          <div><p class="eyebrow">CARTRIDGE 03</p><h1 id="game-title">絵合わせポーカー</h1></div>
          <div class="coin-box"><span>COIN</span><strong id="coin-count">20</strong></div>
        </header>

        <div class="payout-board" aria-label="配当表">
          <span>5 MATCH <b>×20</b></span><span>4 MATCH <b>×8</b></span><span>FULL HOUSE <b>×5</b></span>
          <span>3 MATCH <b>×3</b></span><span>2 PAIR <b>×2</b></span><span>1 PAIR <b>×1</b></span>
        </div>

        <div class="poker-table">
          <div class="hand-zone cpu-zone">
            <span class="hand-label">CPU</span>
            <div id="cpu-hand" class="poker-hand" aria-label="CPUの手札"></div>
          </div>
          <div class="symbol-order" aria-hidden="true">☀ &gt; ★ &gt; ♥ &gt; 7 &gt; ●</div>
          <div class="hand-zone player-zone">
            <span class="hand-label">YOU</span>
            <div id="poker-hand" class="poker-hand" aria-label="あなたの手札"></div>
          </div>
          <p id="poker-status" class="poker-status" aria-live="polite">DEALをタップ、またはSTARTで開始</p>
          <button id="poker-action" class="poker-action" type="button">DEAL</button>
        </div>

        <div class="bet-bar">
          <span>BET</span>
          <button id="bet-down" type="button" aria-label="ベットを下げる">−</button>
          <strong id="bet-count">1</strong>
          <button id="bet-up" type="button" aria-label="ベットを上げる">＋</button>
          <span id="round-count">ROUND 00</span>
        </div>
      </div>
    </section>

    <div class="console__controls poker-controls" aria-label="ゲーム機コントローラー">
      <div class="dpad" role="group" aria-label="十字キー">
        <button class="dpad__key dpad__key--up" type="button" data-control="up" aria-label="上"></button>
        <button class="dpad__key dpad__key--right" type="button" data-control="right" aria-label="右"></button>
        <button class="dpad__key dpad__key--down" type="button" data-control="down" aria-label="下"></button>
        <button class="dpad__key dpad__key--left" type="button" data-control="left" aria-label="左"></button>
        <span class="dpad__center" aria-hidden="true"></span>
      </div>
      <div class="control-meta">
        <div class="system-buttons">
          <button class="system-button" type="button" data-control="select">BET</button>
          <button id="start-control" class="system-button" type="button" data-control="start">DEAL</button>
        </div>
        <span id="poker-mode">BET 1</span>
      </div>
      <div class="ab-buttons" role="group" aria-label="A・Bボタン">
        <button class="ab-button ab-button--b" type="button" data-control="b"><span>B</span><small>CLEAR</small></button>
        <button class="ab-button ab-button--a" type="button" data-control="a"><span>A</span><small>CHANGE</small></button>
      </div>
    </div>
  </main>
</body>
</html>
