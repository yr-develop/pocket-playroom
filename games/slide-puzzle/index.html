<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#252a34">
  <meta name="description" content="手数とタイムを計れる、シンプルな数字スライドパズル。">
  <title>スライドパズル | POCKET PLAYROOM</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23252a34'/%3E%3Cpath d='M12 12h18v18H12zm22 0h18v18H34zM12 34h18v18H12z' fill='%23c6df92'/%3E%3Ctext x='43' y='49' text-anchor='middle' font-size='16' font-family='monospace' fill='%23f4cc5d'%3E15%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="game.css">
  <script src="../../assets/js/frame.js"></script>
  <script src="../../assets/js/soundboard.js" defer></script>
  <script src="../../assets/js/controls.js" defer></script>
  <script src="game.js" defer></script>
</head>
<body>
  <main class="console console--puzzle" aria-labelledby="game-title">
    <div class="console__topbar">
      <a class="back-link" href="../../">← LOBBY</a>
      <span class="speaker-slots" aria-hidden="true"></span>
      <button class="text-button" type="button" data-sound-toggle aria-pressed="true">♪ SOUND ON</button>
    </div>

    <section class="screen-wrap">
      <div class="screen puzzle-screen">
        <header class="puzzle-header">
          <div>
            <p class="eyebrow">CARTRIDGE 02</p>
            <h1 id="game-title">スライドパズル</h1>
          </div>
          <label class="size-picker">SIZE
            <select id="size-select" aria-label="盤面サイズ">
              <option value="3">3 × 3</option>
              <option value="4" selected>4 × 4</option>
              <option value="5">5 × 5</option>
            </select>
          </label>
        </header>

        <div class="score-strip" aria-label="ゲーム記録">
          <div><span>MOVES</span><strong id="move-count">000</strong></div>
          <div><span>TIME</span><strong id="time-count">00:00.0</strong></div>
        </div>

        <div id="puzzle-board" class="puzzle-board" role="group" aria-label="スライドパズル盤面"></div>
        <p id="puzzle-status" class="puzzle-status" aria-live="polite">タイルをタップ、または十字キーで動かそう</p>

        <div id="puzzle-result" class="puzzle-result" hidden>
          <p class="eyebrow">PUZZLE CLEAR</p>
          <h2>COMPLETE!</h2>
          <p id="result-record"></p>
          <button id="again-button" class="action-button" type="button">もう一度</button>
        </div>
      </div>
    </section>

    <div class="console__controls puzzle-controls" aria-label="ゲーム機コントローラー">
      <div class="dpad" role="group" aria-label="十字キー">
        <button class="dpad__key dpad__key--up" type="button" data-control="up" aria-label="上"></button>
        <button class="dpad__key dpad__key--right" type="button" data-control="right" aria-label="右"></button>
        <button class="dpad__key dpad__key--down" type="button" data-control="down" aria-label="下"></button>
        <button class="dpad__key dpad__key--left" type="button" data-control="left" aria-label="左"></button>
        <span class="dpad__center" aria-hidden="true"></span>
      </div>
      <div class="control-meta">
        <div class="system-buttons">
          <button class="system-button" type="button" data-control="select">SIZE</button>
          <button class="system-button" type="button" data-control="start">PAUSE</button>
        </div>
        <span id="puzzle-mode">4 × 4</span>
      </div>
      <div class="ab-buttons" role="group" aria-label="A・Bボタン">
        <button class="ab-button ab-button--b" type="button" data-control="b"><span>B</span><small>LOBBY</small></button>
        <button class="ab-button ab-button--a" type="button" data-control="a"><span>A</span><small>HINT</small></button>
      </div>
    </div>
  </main>
</body>
</html>
